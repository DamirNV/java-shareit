name: Java CI with Maven

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Gateway
        run: |
          cd gateway
          mvn clean verify

      - name: Build Server (with H2 profile)
        run: |
          cd server
          mvn clean verify -Dspring.profiles.active=test
